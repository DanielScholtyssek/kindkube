apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-manifests
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/DanielScholtyssek/kindkube.git
    targetRevision: HEAD
    path: infra/metallb-manifests
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
