apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: metallb-applicationset
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/auto-sync: "true"
spec:
  project: metallb-project
  generators:
  # Generator 1: MetalLB Helm Chart
  - git:
      repoURL: https://metallb.github.io/metallb
      revision: HEAD
      directories:
      - path: .
    template:
      metadata:
        name: 'metallb-helm-{{path.basename}}'
        annotations:
          argocd.argoproj.io/sync-wave: "2"
          argocd.argoproj.io/auto-sync: "true"
      spec:
        project: metallb-project
        source:
          repoURL: https://metallb.github.io/metallb
          chart: metallb
          targetRevision: "*"
          helm:
            releaseName: metallb
            valuesObject:
              speaker:
                enabled: true
              controller:
                enabled: true
              prometheus:
                serviceMonitor:
                  enabled: false
                rule:
                  enabled: false
        destination:
          server: https://kubernetes.default.svc
          namespace: metallb-system
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
  
  # Generator 2: MetalLB Manifests
  - git:
      repoURL: https://github.com/DanielScholtyssek/kindkube.git
      revision: HEAD
      directories:
      - path: infra/metallb/manifests
    template:
      metadata:
        name: 'metallb-manifests-{{path.basename}}'
        annotations:
          argocd.argoproj.io/sync-wave: "3"
          argocd.argoproj.io/auto-sync: "true"
      spec:
        project: metallb-project
        source:
          repoURL: https://github.com/DanielScholtyssek/kindkube.git
          targetRevision: HEAD
          path: '{{path}}'
          directory:
            recurse: true
        destination:
          server: https://kubernetes.default.svc
          namespace: default
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
