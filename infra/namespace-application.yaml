apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-namespace
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/auto-sync: "true"
spec:
  project: default
  source:
    repoURL: https://github.com/DanielScholtyssek/kindkube.git
    targetRevision: HEAD
    path: infra/metallb/manifests
    directory:
      recurse: true
      include: "namespace.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
