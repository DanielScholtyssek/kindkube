apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kindkube-apps-project
  namespace: argocd
spec:
  sourceRepos:
  - https://github.com/DanielScholtyssek/kindkube.git
  destinations:
  - namespace: default
    server: https://kubernetes.default.svc
  - namespace: '*'
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
