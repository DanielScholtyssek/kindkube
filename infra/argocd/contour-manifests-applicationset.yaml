apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: contour-manifests
  namespace: argocd
spec:
  generators:
  - git:
      repoURL: https://github.com/DanielScholtyssek/kindkube.git
      revision: HEAD
      directories:
      - path: infra/contour/manifests
  template:
    metadata:
      name: 'contour-{{path.basename}}'
      annotations:
        argocd.argoproj.io/sync-wave: "3"
        argocd.argoproj.io/auto-sync: "true"
    spec:
      project: contour-project
      source:
        repoURL: https://github.com/DanielScholtyssek/kindkube.git
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: projectcontour
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - RespectIgnoreDifferences=true
