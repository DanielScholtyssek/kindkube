apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/auto-sync: "true"
spec:
  project: cert-manager-project
  source:
    repoURL: oci://quay.io/jetstack/charts/cert-manager
    chart: cert-manager
    targetRevision: "v1.19.4"
    helm:
      releaseName: cert-manager
      valuesObject:
        crds:
          enabled: true
        prometheus:
          serviceMonitor:
            enabled: false
          rule:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 2s
        factor: 1
        maxDuration: 30s
