apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
    argocd.argoproj.io/auto-sync: "true"
spec:
  project: cnpg-project
  source:
    repoURL: https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release/v0.27.1/releases/cnpg-0.27.1.yaml
    targetRevision: HEAD
    path: ""
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: false  # Don't delete CRDs when app is deleted
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 2s
        factor: 1
        maxDuration: 30s
