# Strategic merge patch to add nodeSelector to existing Envoy DaemonSet
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: envoy-contour
  namespace: projectcontour
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/role: control-plane
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
