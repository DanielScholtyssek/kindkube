apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kindkube-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DanielScholtyssek/kindkube.git
    targetRevision: HEAD
    path: config
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
