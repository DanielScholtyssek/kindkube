apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kindkube-infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/auto-sync: "true"
spec:
  project: default
  source:
    repoURL: https://github.com/DanielScholtyssek/kindkube.git
    targetRevision: HEAD
    path: infra/argocd
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 2s
        factor: 1
        maxDuration: 30s
